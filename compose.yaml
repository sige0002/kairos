# =============================================================================
# kairos — root docker compose entry point.
# Brings up all 7 services (recorder / monitor / streamer / probe / orchestrator
# / dora_runner / frontend). Wires env, ports, volumes, DDS networking, and a
# per-service healthcheck.
#
#   cp .env.example .env   # then edit
#   docker compose up
#
# ---- Networking decision (important) ----------------------------------------
# All services use `network_mode: host`. Rationale:
#   * The 3 ROS services (recorder/monitor/streamer) must share the host's
#     DDS graph to discover topics — the same setup the test harness uses
#     (deploy/test/compose.yaml: network_mode host + ROS_DOMAIN_ID=0). Bridge
#     networking would block DDS multicast discovery.
#   * Host networking for the ROS services means they are NOT on a compose
#     bridge network, so the pure-Python services (orchestrator/dora_runner)
#     could not reach them by compose service name. Putting every service on
#     host networking removes that mixed-network split: each service reaches
#     the others at localhost:<port>, consistent with the test harness.
#   * Network assumption is a trusted single host / LAN with no auth
#     (docs/specs/ja/config.md), which host networking matches.
# Trade-off: host networking has no port mapping (ports bind directly to the
# host) and no compose network isolation. On a multi-tenant host, switch the
# Python services to a bridge network with explicit DDS unicast peers for the
# ROS services (see the docker-ros2-development skill). Left as host for now.
#
# Each service reads its config from the root .env (env_file below). All ports
# have a single source of truth: the pydantic defaults in
# libs/kairos_common/settings.py, overridable per key via .env. Where a port is
# needed by two sides (e.g. the recorder's bind + the orchestrator's client, or
# nginx's proxy_pass), it is interpolated here as ${VAR:-<default>} so one .env
# value drives both — never hardcode a literal that can drift from settings.py.
# =============================================================================
name: kairos

# Shared ROS env for the 3 ROS-based services.
# Both RMW implementations are bundled in the images (Fast DDS + Cyclone DDS), so
# RMW_IMPLEMENTATION switches between them at deploy time — set it to
# rmw_cyclonedds_cpp in .env to talk to a Cyclone DDS robot. ROS 2 requires the
# SAME RMW on both ends and ROS_DOMAIN_ID must match the robot. For cross-host
# Cyclone unicast peers, set CYCLONEDDS_URI in .env (it is loaded via env_file
# and reaches the container; point it at an xml under the mounted /config).
x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  # Active robot — config/<robot>/ (committed) or config/local/<robot>/ (gitignored).
  ROBOT: ${ROBOT:-airoa_hsr}

# Every kairos HTTP call is LAN-internal (localhost or the robot's LAN IP) and
# must never go through a corporate proxy: a host whose Docker client/daemon
# has HTTP(S)_PROXY configured silently injects those vars into every
# container, and then healthchecks (python urllib honors the proxy vars) and
# service-to-service calls fail. NO_PROXY exempts them; on the cross-host
# split extend it with the robot's IP in .env (see .env.split.example).
x-no-proxy: &no-proxy
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
  no_proxy: ${NO_PROXY:-localhost,127.0.0.1}

# Build-time proxy passthrough for the images whose builder stage fetches from
# the internet: the 4 ROS ones run `uv pip install` against PyPI, and
# dora_runner additionally builds the vendored bagflow crates (crates.io) and
# downloads the dora CLI release. They need the same corporate proxy the host
# uses (empty defaults are a no-op off-proxy). Paired with `build: network: host`
# below so DNS resolution uses the host's resolver instead of Docker's isolated
# build-bridge network.
x-build-proxy-args: &build-proxy-args
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}

# Shared healthcheck cadence (conservative — the services are lightweight, but the
# ROS ones need a moment to import rclpy). Each service overrides `test` with its
# own port; the port is interpolated here as ${VAR:-default} (same single source
# as everywhere else) so the check hits the same port the service binds. Every
# Python service serves GET /healthz from kairos_common.create_app and every
# image ships python3, so the check needs no extra tooling; the nginx frontend
# has no python3, so it uses the image's busybox wget instead. On host networking
# each service is reachable at localhost:<port>.
x-healthcheck: &healthcheck
  interval: 15s
  timeout: 3s
  retries: 3
  start_period: 20s

services:
  # ---- ROS 2 services (host networking for the shared DDS graph) -----------
  recorder:
    build:
      context: .
      dockerfile: services/rosbag2_recorder/Dockerfile
      network: host
      args:
        <<: *build-proxy-args
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: kairos-rosbag2-recorder:${ROS_DISTRO:-jazzy}
    env_file:
      - path: ${KAIROS_ENV_FILE:-.env}
        required: false
    environment:
      <<: [*ros-env, *no-proxy]
      RECORDER_PORT: ${RECORDER_PORT:-8010}
      RECORDING_CONFIG: ${RECORDING_CONFIG:-/config/${ROBOT:-airoa_hsr}/recording/default.yaml}
    network_mode: host
    # Share the host IPC namespace so FastDDS shared-memory transport delivers
    # data across containers (host networking carries only UDP discovery).
    ipc: host
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ./config:/config:ro
      # Optional custom-message colcon overlay (sourced by the entrypoint if it
      # contains install/setup.bash); the default 'robot' overlay ships empty.
      # Override per robot: MSGS_OVERLAY_DIR=./deploy/msgs_overlay/<robot>. See
      # deploy/msgs_overlay/README.md.
      - ${MSGS_OVERLAY_DIR:-./deploy/msgs_overlay/robot}:/opt/msgs_overlay:ro
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:${RECORDER_PORT:-8010}/healthz', timeout=2)"
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: services/topic_monitor/Dockerfile
      network: host
      args:
        <<: *build-proxy-args
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: kairos-topic-monitor:${ROS_DISTRO:-jazzy}
    env_file:
      - path: ${KAIROS_ENV_FILE:-.env}
        required: false
    environment:
      <<: [*ros-env, *no-proxy]
      RECORDING_CONFIG: ${RECORDING_CONFIG:-/config/${ROBOT:-airoa_hsr}/recording/default.yaml}
      # Optional alert rules: config/<robot>/monitoring/alerts.yaml (a local
      # override under config/local/<robot>/... wins). Empty = alerts disabled.
      # `make` derives this from ROBOT; without make, set it in .env.
      ALERT_CONFIG_PATH: ${ALERT_CONFIG_PATH:-}
    network_mode: host
    ipc: host
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ./config:/config:ro
      # Custom-message overlay (same dir the recorder uses): lets the monitor
      # subscribe to custom message types on a live robot. Empty by default.
      - ${MSGS_OVERLAY_DIR:-./deploy/msgs_overlay/robot}:/opt/msgs_overlay:ro
    # Health = READINESS here (unlike the other services' liveness /healthz). The
    # monitor's whole job is to subscribe to the DDS graph and publish metrics;
    # its /readyz reports 200 only once the subscriber spin-up succeeded, so an
    # unhealthy container really is one that cannot serve metrics (a liveness
    # /healthz would stay "healthy" even if the subscriber thread died). /readyz
    # here depends ONLY on the monitor's own function — no downstream deps — so it
    # is safe to drive container health (contrast the orchestrator below).
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:${TOPIC_MONITOR_PORT:-8001}/readyz', timeout=2)"
    restart: unless-stopped

  streamer:
    build:
      context: .
      dockerfile: services/webrtc_streamer/Dockerfile
      network: host
      args:
        <<: *build-proxy-args
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: kairos-webrtc-streamer:${ROS_DISTRO:-jazzy}
    env_file:
      - path: ${KAIROS_ENV_FILE:-.env}
        required: false
    environment:
      <<: [*ros-env, *no-proxy]
    network_mode: host
    ipc: host
    volumes:
      - ${DATA_DIR:-./data}:/data
      # Read-only config mount (parity with recorder/monitor) so an optional
      # CYCLONEDDS_URI=file:///config/cyclonedds-localhost.xml resolves here too.
      - ./config:/config:ro
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:${WEBRTC_PORT:-8002}/healthz', timeout=2)"
    restart: unless-stopped

  # topic_probe — generic numeric-field live plotter (OL-3.3). A SEPARATE ROS
  # service from monitor/recorder that DECODES one selected topic at a time to
  # plot its numeric fields. Isolated on purpose: a probe crash can never affect
  # recording or the non-intrusive monitor. Same DDS sharing as the other ROS
  # services (host net + host ipc); the overlay lets it decode custom types.
  probe:
    build:
      context: .
      dockerfile: services/topic_probe/Dockerfile
      network: host
      args:
        <<: *build-proxy-args
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: kairos-topic-probe:${ROS_DISTRO:-jazzy}
    env_file:
      - path: ${KAIROS_ENV_FILE:-.env}
        required: false
    environment:
      <<: [*ros-env, *no-proxy]
      TOPIC_PROBE_PORT: ${TOPIC_PROBE_PORT:-8003}
    network_mode: host
    ipc: host
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ./config:/config:ro
      # Custom-message overlay (same dir the recorder/monitor use): lets the
      # probe DECODE custom message types on a live robot. Empty by default.
      - ${MSGS_OVERLAY_DIR:-./deploy/msgs_overlay/robot}:/opt/msgs_overlay:ro
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:${TOPIC_PROBE_PORT:-8003}/healthz', timeout=2)"
    restart: unless-stopped

  # ---- Pure-Python services (no rclpy) -------------------------------------
  orchestrator:
    build:
      context: .
      dockerfile: services/api_orchestrator/Dockerfile
    # Release-versioned tag: KAIROS_VERSION comes from the root VERSION file (the
    # Makefile exports it); it falls back to :dev for a bare `docker compose build`
    # so an unversioned local build never silently overwrites a released :latest.
    image: kairos-api-orchestrator:${KAIROS_VERSION:-dev}
    env_file:
      - path: ${KAIROS_ENV_FILE:-.env}
        required: false
    environment:
      <<: *no-proxy
      RECORDING_CONFIG: ${RECORDING_CONFIG:-/config/${ROBOT:-airoa_hsr}/recording/default.yaml}
      # Active robot — labels the config set the Config tab edits/selects.
      ROBOT: ${ROBOT:-airoa_hsr}
      # Robot-first config roots the Config tab catalog scans (committed + local).
      CONFIG_DIR: ${CONFIG_DIR:-/config}
      CONFIG_LOCAL_DIR: ${CONFIG_LOCAL_DIR:-/config/local}
      # Stream tab initial preview layout (config/<robot>/stream/default.yaml).
      STREAM_CONFIG: ${STREAM_CONFIG:-/config/${ROBOT:-airoa_hsr}/stream/default.yaml}
      # Browser-facing base URL the frontend uses for camera (WebRTC) signaling,
      # returned as endpoints.webrtc in GET /api/v1/config. Default "/webrtc" is
      # the same-origin nginx proxy (frontend/nginx.conf), so the preview works
      # over LAN IP / SSH tunnel / Tailscale without CORS. Listed here (overrides
      # env_file) so a stale absolute value in .env does not win. Set an absolute
      # http://<host>:8002 only for the legacy direct-connect mode.
      WEBRTC_PUBLIC_URL: ${WEBRTC_PUBLIC_URL:-/webrtc}
      # Downstream service hosts. Default localhost = single-host deploy. For the
      # robot-edge split (compose.recording.yaml) point the DDS-reading services
      # at the robot's LAN IP; DORA_RUNNER_HOST stays local (CPU-heavy, runs
      # beside the orchestrator). See docs/specs/ja/deployment_topology.md.
      RECORDER_HOST: ${RECORDER_HOST:-localhost}
      TOPIC_MONITOR_HOST: ${TOPIC_MONITOR_HOST:-localhost}
      WEBRTC_HOST: ${WEBRTC_HOST:-localhost}
      TOPIC_PROBE_HOST: ${TOPIC_PROBE_HOST:-localhost}
      DORA_RUNNER_HOST: ${DORA_RUNNER_HOST:-localhost}
    # Health = LIVENESS (/healthz), deliberately NOT readiness. The orchestrator's
    # /readyz aggregates downstream services (recorder/monitor/etc.), so wiring the
    # container healthcheck to it would flip the orchestrator to "unhealthy"
    # whenever a downstream service is merely down — even though the API/UI itself
    # is fine and is exactly what an operator needs to diagnose the failure. An
    # "unhealthy" orchestrator then fails the frontend's `depends_on:
    # service_healthy` gate and would be auto-restarted by Swarm / an autoheal
    # supervisor. /healthz reflects only that the orchestrator's own process is up,
    # which is the correct signal for container health.
    # Run as the host user so the host-owned ./data mount is writable (the slim
    # image is otherwise non-root with a different uid). Defaults to 1000:1000.
    user: "${UID:-1000}:${GID:-1000}"
    # Host networking so it can reach the ROS services at localhost:<port>
    # (see the networking decision note above).
    network_mode: host
    volumes:
      - ${DATA_DIR:-./data}:/data
      # Read-WRITE (unlike the ROS services below): the Config tab persists edits
      # via PUT /api/v1/config/recording, which atomically writes the active
      # config file. Runs as the host user (uid above) so the host-owned ./config
      # is writable. Keep this on a trusted LAN only — the UI can rewrite config.
      - ./config:/config
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:${API_ORCH_PORT:-8000}/healthz', timeout=2)"
    restart: unless-stopped

  dora_runner:
    build:
      context: .
      dockerfile: services/dora_runner/Dockerfile
      network: host
      args:
        <<: *build-proxy-args
    image: kairos-dora-runner:${KAIROS_VERSION:-dev}
    env_file:
      - path: ${KAIROS_ENV_FILE:-.env}
        required: false
    environment:
      <<: *no-proxy
      DORA_RUNNER_PORT: ${DORA_RUNNER_PORT:-8020}
      ROBOT: ${ROBOT:-airoa_hsr}
      # loss_report validator defaults (config/<robot>/validators/loss_report.yaml).
      LOSS_REPORT_CONFIG: ${LOSS_REPORT_CONFIG:-/config/${ROBOT:-airoa_hsr}/validators/loss_report.yaml}
      RECORDING_CONFIG: ${RECORDING_CONFIG:-/config/${ROBOT:-airoa_hsr}/recording/default.yaml}
      # full_validation flows (bagflow flow.yml files) for the active robot.
      BAGFLOW_FLOWS_DIR: ${BAGFLOW_FLOWS_DIR:-/config/${ROBOT:-airoa_hsr}/flows}
      # This service runs its OWN dora coordinator/daemon (loopback only). With
      # host networking those ports are host-wide, so they deliberately differ
      # from dora's own defaults (6012/53290/53291) — any other dora on this
      # host keeps its endpoint, and we never adopt one we do not own.
      KAIROS_DORA_CONTROL_PORT: ${KAIROS_DORA_CONTROL_PORT:-6112}
      KAIROS_DORA_DAEMON_PORT: ${KAIROS_DORA_DAEMON_PORT:-53390}
      KAIROS_DORA_DAEMON_LISTEN_PORT: ${KAIROS_DORA_DAEMON_LISTEN_PORT:-53391}
    # Run as the host user so the host-owned ./data mount is writable.
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: host
    # dora passes every inter-node message through /dev/shm; a decoded-image
    # flow holds queue_size x frame-size per edge, which blows past Docker's
    # 64 MB default — and a node that runs out is killed WITHOUT a log line.
    shm_size: ${DORA_RUNNER_SHM_SIZE:-2gb}
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ./config:/config:ro
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:${DORA_RUNNER_PORT:-8020}/healthz', timeout=2)"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    image: kairos-frontend:${KAIROS_VERSION:-dev}
    env_file:
      - path: ${KAIROS_ENV_FILE:-.env}
        required: false
    environment:
      <<: *no-proxy
      # busybox wget (the healthcheck below) honors http_proxy but NOT no_proxy,
      # so also neutralize the proxy vars a proxied Docker client would inject.
      # nginx itself never reads the proxy env.
      http_proxy: ""
      HTTP_PROXY: ""
      # Ports consumed by the nginx envsubst template (default.conf.template):
      # FRONTEND_PORT for `listen`, API_ORCH_PORT / WEBRTC_PORT / TOPIC_PROBE_PORT
      # for proxy_pass. Interpolated from the same .env keys (defaults match
      # settings.py) so the served config never drifts from where the
      # orchestrator/streamer/probe bind.
      FRONTEND_PORT: ${FRONTEND_PORT:-8080}
      API_ORCH_PORT: ${API_ORCH_PORT:-8000}
      WEBRTC_PORT: ${WEBRTC_PORT:-8002}
      TOPIC_PROBE_PORT: ${TOPIC_PROBE_PORT:-8003}
      # Upstream HOSTS for the nginx proxy. Default 127.0.0.1 = single-host
      # (co-located) deploy. For the robot-edge split (compose.recording.yaml),
      # point WEBRTC_HOST / PROBE_HOST at the ROBOT's LAN IP (streamer + probe
      # run on the robot); API_HOST stays the orchestrator host (co-located with
      # the frontend on the recording PC). These MUST be present so envsubst does
      # not leave a literal ${API_HOST} in the rendered nginx config.
      API_HOST: ${API_HOST:-127.0.0.1}
      WEBRTC_HOST: ${WEBRTC_HOST:-127.0.0.1}
      PROBE_HOST: ${PROBE_HOST:-127.0.0.1}
    network_mode: host
    # nginx-alpine has no python3; use the image's busybox wget against the SPA
    # root (nginx serves index.html there once it is up).
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - "http://localhost:${FRONTEND_PORT:-8080}/"
    restart: unless-stopped
    # Wait for the orchestrator to pass its healthcheck: the SPA's first request
    # is GET /api/v1/config, which the frontend proxies to the orchestrator.
    depends_on:
      orchestrator:
        condition: service_healthy
