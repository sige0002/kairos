# =============================================================================
# kairos — root docker compose entry point (Stage 0 skeleton).
# Brings up all 6 services as runnable shells. Real service logic lands in
# later stages; this only wires env, ports, volumes, and DDS networking.
#
#   cp .env.example .env   # then edit
#   docker compose up
#
# ---- Networking decision (important) ----------------------------------------
# All services use `network_mode: host`. Rationale:
#   * The 3 ROS services (recorder/monitor/streamer) must share the host's
#     DDS graph to discover topics — the same setup the test harness uses
#     (deploy/test/compose.yaml: network_mode host + ROS_DOMAIN_ID=0). Bridge
#     networking would block DDS multicast discovery.
#   * Host networking for the ROS services means they are NOT on a compose
#     bridge network, so the pure-Python services (orchestrator/dora_runner)
#     could not reach them by compose service name. Putting every service on
#     host networking removes that mixed-network split: each service reaches
#     the others at localhost:<port>, consistent with the test harness.
#   * Network assumption is a trusted single host / LAN with no auth
#     (docs/specs/ja/config.md), which host networking matches.
# Trade-off: host networking has no port mapping (ports bind directly to the
# host) and no compose network isolation. On a multi-tenant host, switch the
# Python services to a bridge network with explicit DDS unicast peers for the
# ROS services (see the docker-ros2-development skill). Left as host for now.
#
# Each service reads its config from the root .env (env_file below). All ports
# have a single source of truth: the pydantic defaults in
# libs/kairos_common/settings.py, overridable per key via .env. Where a port is
# needed by two sides (e.g. the recorder's bind + the orchestrator's client, or
# nginx's proxy_pass), it is interpolated here as ${VAR:-<default>} so one .env
# value drives both — never hardcode a literal that can drift from settings.py.
# =============================================================================
name: kairos

# Shared ROS env for the 3 ROS-based services.
# Both RMW implementations are bundled in the images (Fast DDS + Cyclone DDS), so
# RMW_IMPLEMENTATION switches between them at deploy time — set it to
# rmw_cyclonedds_cpp in .env to talk to a Cyclone DDS robot. ROS 2 requires the
# SAME RMW on both ends and ROS_DOMAIN_ID must match the robot. For cross-host
# Cyclone unicast peers, set CYCLONEDDS_URI in .env (it is loaded via env_file
# and reaches the container; point it at an xml under the mounted /config).
x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  # Active robot — config/<robot>/ (committed) or config/local/<robot>/ (gitignored).
  ROBOT: ${ROBOT:-airoa_hsr}

services:
  # ---- ROS 2 services (host networking for the shared DDS graph) -----------
  recorder:
    build:
      context: .
      dockerfile: services/rosbag2_recorder/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: kairos-rosbag2-recorder:${ROS_DISTRO:-jazzy}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *ros-env
      RECORDER_PORT: ${RECORDER_PORT:-8010}
      RECORDING_CONFIG: ${RECORDING_CONFIG:-/config/${ROBOT:-airoa_hsr}/recording/default.yaml}
    network_mode: host
    # Share the host IPC namespace so FastDDS shared-memory transport delivers
    # data across containers (host networking carries only UDP discovery).
    ipc: host
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ./config:/config:ro
      # Optional custom-message colcon overlay (sourced by the entrypoint if it
      # contains install/setup.bash); the default 'robot' overlay ships empty.
      # Override per robot: MSGS_OVERLAY_DIR=./deploy/msgs_overlay/<robot>. See
      # deploy/msgs_overlay/README.md.
      - ${MSGS_OVERLAY_DIR:-./deploy/msgs_overlay/robot}:/opt/msgs_overlay:ro
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: services/topic_monitor/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: kairos-topic-monitor:${ROS_DISTRO:-jazzy}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *ros-env
      RECORDING_CONFIG: ${RECORDING_CONFIG:-/config/${ROBOT:-airoa_hsr}/recording/default.yaml}
    network_mode: host
    ipc: host
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ./config:/config:ro
      # Custom-message overlay (same dir the recorder uses): lets the monitor
      # subscribe to custom message types on a live robot. Empty by default.
      - ${MSGS_OVERLAY_DIR:-./deploy/msgs_overlay/robot}:/opt/msgs_overlay:ro
    restart: unless-stopped

  streamer:
    build:
      context: .
      dockerfile: services/webrtc_streamer/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: kairos-webrtc-streamer:${ROS_DISTRO:-jazzy}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *ros-env
    network_mode: host
    ipc: host
    volumes:
      - ${DATA_DIR:-./data}:/data
      # Read-only config mount (parity with recorder/monitor) so an optional
      # CYCLONEDDS_URI=file:///config/cyclonedds.xml resolves here too.
      - ./config:/config:ro
    restart: unless-stopped

  # topic_probe — generic numeric-field live plotter (OL-3.3). A SEPARATE ROS
  # service from monitor/recorder that DECODES one selected topic at a time to
  # plot its numeric fields. Isolated on purpose: a probe crash can never affect
  # recording or the non-intrusive monitor. Same DDS sharing as the other ROS
  # services (host net + host ipc); the overlay lets it decode custom types.
  probe:
    build:
      context: .
      dockerfile: services/topic_probe/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: kairos-topic-probe:${ROS_DISTRO:-jazzy}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *ros-env
      TOPIC_PROBE_PORT: ${TOPIC_PROBE_PORT:-8003}
    network_mode: host
    ipc: host
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ./config:/config:ro
      # Custom-message overlay (same dir the recorder/monitor use): lets the
      # probe DECODE custom message types on a live robot. Empty by default.
      - ${MSGS_OVERLAY_DIR:-./deploy/msgs_overlay/robot}:/opt/msgs_overlay:ro
    restart: unless-stopped

  # ---- Pure-Python services (no rclpy) -------------------------------------
  orchestrator:
    build:
      context: .
      dockerfile: services/api_orchestrator/Dockerfile
    image: kairos-api-orchestrator:latest
    env_file:
      - path: .env
        required: false
    environment:
      RECORDING_CONFIG: ${RECORDING_CONFIG:-/config/${ROBOT:-airoa_hsr}/recording/default.yaml}
      # Active robot — labels the config set the Config tab edits/selects.
      ROBOT: ${ROBOT:-airoa_hsr}
      # Robot-first config roots the Config tab catalog scans (committed + local).
      CONFIG_DIR: ${CONFIG_DIR:-/config}
      CONFIG_LOCAL_DIR: ${CONFIG_LOCAL_DIR:-/config/local}
      # Stream tab initial preview layout (config/<robot>/stream/default.yaml).
      STREAM_CONFIG: ${STREAM_CONFIG:-/config/${ROBOT:-airoa_hsr}/stream/default.yaml}
      # Browser-facing base URL the frontend uses for camera (WebRTC) signaling,
      # returned as endpoints.webrtc in GET /api/v1/config. Default "/webrtc" is
      # the same-origin nginx proxy (frontend/nginx.conf), so the preview works
      # over LAN IP / SSH tunnel / Tailscale without CORS. Listed here (overrides
      # env_file) so a stale absolute value in .env does not win. Set an absolute
      # http://<host>:8002 only for the legacy direct-connect mode.
      WEBRTC_PUBLIC_URL: ${WEBRTC_PUBLIC_URL:-/webrtc}
    # Run as the host user so the host-owned ./data mount is writable (the slim
    # image is otherwise non-root with a different uid). Defaults to 1000:1000.
    user: "${UID:-1000}:${GID:-1000}"
    # Host networking so it can reach the ROS services at localhost:<port>
    # (see the networking decision note above).
    network_mode: host
    volumes:
      - ${DATA_DIR:-./data}:/data
      # Read-WRITE (unlike the ROS services below): the Config tab persists edits
      # via PUT /api/v1/config/recording, which atomically writes the active
      # config file. Runs as the host user (uid above) so the host-owned ./config
      # is writable. Keep this on a trusted LAN only — the UI can rewrite config.
      - ./config:/config
    restart: unless-stopped

  dora_runner:
    build:
      context: .
      dockerfile: services/dora_runner/Dockerfile
    image: kairos-dora-runner:latest
    env_file:
      - path: .env
        required: false
    environment:
      DORA_RUNNER_PORT: ${DORA_RUNNER_PORT:-8020}
      ROBOT: ${ROBOT:-airoa_hsr}
      # loss_report validator defaults (config/<robot>/validators/loss_report.yaml).
      LOSS_REPORT_CONFIG: ${LOSS_REPORT_CONFIG:-/config/${ROBOT:-airoa_hsr}/validators/loss_report.yaml}
      RECORDING_CONFIG: ${RECORDING_CONFIG:-/config/${ROBOT:-airoa_hsr}/recording/default.yaml}
    # Run as the host user so the host-owned ./data mount is writable.
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: host
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ./config:/config:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    image: kairos-frontend:latest
    env_file:
      - path: .env
        required: false
    environment:
      # Ports consumed by the nginx envsubst template (default.conf.template):
      # FRONTEND_PORT for `listen`, API_ORCH_PORT / WEBRTC_PORT / TOPIC_PROBE_PORT
      # for proxy_pass. Interpolated from the same .env keys (defaults match
      # settings.py) so the served config never drifts from where the
      # orchestrator/streamer/probe bind.
      FRONTEND_PORT: ${FRONTEND_PORT:-8080}
      API_ORCH_PORT: ${API_ORCH_PORT:-8000}
      WEBRTC_PORT: ${WEBRTC_PORT:-8002}
      TOPIC_PROBE_PORT: ${TOPIC_PROBE_PORT:-8003}
    network_mode: host
    restart: unless-stopped
    depends_on:
      - orchestrator
