# Root tooling config for the kairos monorepo (Python).
# Per-service packaging lives in each services/<svc>/pyproject.toml and
# libs/kairos_common/pyproject.toml; this file holds only shared tool settings
# (ruff + pytest) applied across the repo.

[tool.ruff]
line-length = 88
target-version = "py312"
# The rosbag2lerobot submodule carries its own ruff rules; linting it with
# kairos's would both fail CI and dirty a pinned checkout.
extend-exclude = ["services/frontend", "services/lerobot_exporter/rosbag2lerobot"]

[tool.ruff.lint]
# A pragmatic baseline: pyflakes, pycodestyle, isort, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are evaluated as argument defaults by design;
# treat them as immutable so B008 does not flag the idiomatic pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
# Discover tests across the shared lib, every Python service, and the deploy
# sidecars. deploy/sync is stdlib-only and has no pyproject of its own, so a
# bare `pytest` at the root is the only thing that runs its tests — without it
# listed here the importer's /pull contract would be untested, which is exactly
# how the v1→v2 rename broke the split transfer unnoticed.
testpaths = ["libs", "services", "deploy"]
# importlib mode lets identically-named test modules (each service has its own
# tests/test_health.py) coexist without sys.path/__init__.py collisions.
addopts = "-q --import-mode=importlib"
