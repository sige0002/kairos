# =============================================================================
# kairos — ROBOT-EDGE compose (the robot-host half of the cross-host split).
#
# WHY THIS FILE EXISTS
# kairos records image-heavy ROS 2 topics. If the recorder/monitor/streamer/probe
# run on a SEPARATE PC, each becomes a REMOTE DDS reader on the robot's graph, so
# the robot's onboard DDS must push every multi-MB camera frame over the NIC and
# service RELIABLE retransmits per remote reader — loading the robot's CPU/network
# and dropping its publish rates. To NOT load the robot, the four DDS-reading
# services run HERE, ON the robot host: they share the robot's DDS graph over
# host-networking + ipc SHM (zero extra network), and only lightweight derived
# data ever leaves the robot (monitor metrics JSON, the already-encoded WebRTC
# preview, and recorded MCAP via post-run file sync — never a heavy DDS flow).
#
# This is a STANDALONE file (not an overlay): it contains ONLY the robot-edge
# services, so you physically cannot start the orchestrator/dora/frontend here.
# Service definitions are pulled from compose/compose.yaml via `extends`, so they never
# drift from the single-host default.
#
#   # on the ROBOT:
#   # first time (or after a code change): build, then start
#   ROBOT=airoa_hsr ROS_DOMAIN_ID=<robot's domain> docker compose --project-directory . -f compose/robot.yaml build
#   ROBOT=airoa_hsr ROS_DOMAIN_ID=<robot's domain> docker compose --project-directory . -f compose/robot.yaml up -d
#   # no network here? carry the images in instead of building:
#   #   (where there IS network)  make robot-images-save
#   #   (here)                    make images-load IMAGES_FILE=kairos-images.tar.gz
#   # (or:  make robot-up)
#
# The recording PC runs compose/recording.yaml and points its service HOSTs at
# this robot's LAN IP. See docs/specs/ja/deployment_topology.md.
# =============================================================================
name: kairos-robot

services:
  recorder:
    extends:
      file: compose/compose.yaml
      service: recorder
    volumes:
      # The inherited relative bind resolves from compose/, so override it from
      # this top-level layout with the repository-root profile directory.
      - ./config:/config:ro
  monitor:
    extends:
      file: compose/compose.yaml
      service: monitor
    volumes:
      - ./config:/config:ro
  streamer:
    extends:
      file: compose/compose.yaml
      service: streamer
    volumes:
      - ./config:/config:ro
  probe:
    extends:
      file: compose/compose.yaml
      service: probe
    volumes:
      - ./config:/config:ro
