# Opt-in high-quality Japanese voice preparation.
#
# Enable with TTS_PROVIDER=voicevox in .env (or .env.split). The Makefile then
# appends this overlay automatically for build/up/images-save. The engine binds
# loopback only; browsers still fetch immutable WAV assets through orchestrator.
services:
  voicevox:
    build:
      context: .
      dockerfile: services/voicevox/Dockerfile
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
        HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
        NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
        http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
        https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
        no_proxy: ${no_proxy:-${NO_PROXY:-}}
        KAIROS_GIT_SHA: ${KAIROS_GIT_SHA:-unknown}
    image: kairos-voicevox:${KAIROS_VERSION:-dev}
    network_mode: host
    command:
      - gosu
      - user
      - /opt/voicevox_engine/run
      - --host
      - 127.0.0.1
    # Bound neural inference so optional audio preparation cannot consume the
    # whole recording PC. Recorder admission still prevents new phrases while
    # armed/recording and rejects publication after a preemption.
    cpus: ${TTS_VOICEVOX_CPUS:-2}
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/50021
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  orchestrator:
    environment:
      TTS_PROVIDER: voicevox
      TTS_VOICEVOX_URL: ${TTS_VOICEVOX_URL:-http://127.0.0.1:50021}
    depends_on:
      voicevox:
        condition: service_healthy
