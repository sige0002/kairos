[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-orchestrator"
version = "0.1.0"
description = "API hub / job & state management for kairos. Stage 0 skeleton."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "kairos-common",
    "uvicorn>=0.30",
    # Internal HTTP client for the recorder (3s timeout + 1 retry).
    "httpx>=0.27",
    # Stop-time quick-check Layer 1: read ONLY the MCAP summary/statistics
    # section of a recorded bag (per-channel counts, start/end) — never a full
    # message scan. Same version dora_runner pins.
    "mcap>=1.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv.sources]
kairos-common = { path = "../../libs/kairos_common", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/api_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
