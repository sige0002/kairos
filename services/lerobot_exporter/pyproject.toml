[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lerobot-exporter"
version = "0.1.0"
description = "LeRobot v3 export service for kairos: stages a dataset's captures and drives the bundled rosbag2lerobot converter."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# The converter itself is NOT a dependency here: it is the bundled
# rosbag2lerobot submodule, installed into the image and reached only as a
# subprocess (KAIROS_LEROBOT_BIN). Keeping it out of this dependency set is what
# lets the tests — and a dev host — run without it.
dependencies = [
    "kairos-common",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv.sources]
kairos-common = { path = "../../libs/kairos_common", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
