[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webrtc-streamer"
version = "0.1.0"
description = "ROS 2 image -> browser WebRTC low-latency preview (kairos)."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "kairos-common",
    "fastapi>=0.111",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    # WebRTC peer/offer-answer + frame conversion (per the spec). aiortc pulls
    # in PyAV; opencv-python-headless avoids GUI/X deps in the container.
    "aiortc>=1.9",
    "av>=12",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv.sources]
kairos-common = { path = "../../libs/kairos_common", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/webrtc_streamer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
