[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dora-runner"
version = "0.1.0"
description = "Post-recording validation & conversion (dora) for kairos. Stage 0 skeleton."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "kairos-common",
    "mcap>=1.4.0",
    "mcap-ros2-support>=0.5.7",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]
dora = [
    "dora-rs>=0.5.0",
]

[tool.uv.sources]
kairos-common = { path = "../../libs/kairos_common", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/dora_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
