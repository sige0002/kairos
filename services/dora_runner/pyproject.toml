[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dora-runner"
version = "0.1.0"
description = "Post-recording validation and conversion pipelines for kairos."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "kairos-common",
    "fastapi>=0.111",
    "mcap>=1.4.0",
    "mcap-ros2-support>=0.5.7",
    "jsonschema>=4.23",
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30",
    # video_check mp4 encode: PyAV bundles ffmpeg (no system ffmpeg needed),
    # Pillow decodes CompressedImage JPEG, numpy bridges frames into PyAV.
    # Lazy-imported, so a missing wheel never breaks module import / the service.
    "av>=12.0",
    "Pillow>=10.0",
    "numpy>=1.26",
]

[project.scripts]
# Local validation CLI: run fast_validation against a run without the HTTP
# server (fast debug iteration). See src/dora_runner/cli.py.
dora-validate = "dora_runner.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]
dora = [
    "dora-rs>=0.5.0",
]

[tool.uv.sources]
kairos-common = { path = "../../libs/kairos_common", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/dora_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
