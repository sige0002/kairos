[package]
name = "mcap2dora"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
arrow = { version = "54.2", default-features = false, features = ["ipc"] }
clap = { version = "4", features = ["derive"] }
mcap = { version = "0.15", features = ["zstd", "lz4"] }
memmap2 = "0.9"

# NOTE (kairos vendoring): upstream mcap2dora is its own workspace root and
# carries a [profile.release] here. As a member of the bagflow workspace that
# section would be ignored with a warning, so it lives in the root Cargo.toml.
