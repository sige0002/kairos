[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "topic-monitor"
version = "0.1.0"
description = "ROS 2 lightweight live monitoring metrics (kairos)."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "kairos-common",
    "fastapi>=0.111",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv.sources]
kairos-common = { path = "../../libs/kairos_common", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/topic_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
