# Static serving for the built kairos frontend + reverse proxy to the
# api_orchestrator so the browser reaches /api on the same origin (no CORS).
# Stage 0 skeleton; tune for production later.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routing serves index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + SSE to the orchestrator. compose.yaml runs every service on
    # host networking (see its networking note), so the orchestrator is reached
    # at localhost:<API_ORCH_PORT> rather than by a compose service name.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SSE: disable buffering so events stream through promptly.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
