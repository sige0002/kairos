[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dora-live"
version = "0.1.0"
description = "Live DDS ingest via dora-ros2-bridge with shared-memory fan-out (kairos)."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "kairos-common",
    "fastapi>=0.111",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pyarrow>=17.0",
    # WebRTC lane (in-node camera preview): aiortc peer/offer-answer + JPEG
    # decode to the video track. Same deps as webrtc_streamer;
    # opencv-python-headless avoids GUI/X deps in the container.
    "aiortc>=1.9",
    "av>=12",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv.sources]
kairos-common = { path = "../../libs/kairos_common", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/dora_live"]

[tool.pytest.ini_options]
testpaths = ["tests"]
