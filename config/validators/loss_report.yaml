# =============================================================================
# config/validators/loss_report.yaml — loss_report validator defaults
# =============================================================================
# loss_report の「閾値」と「対象トピック」をコードのハードコード定数から外出しした
# 設定ファイル。dora_runner がこれを読み、(1) ジョブの params 既定値、(2) /pipelines が
# 返す params_schema の default として使う。値はジョブ params で上書き可能。
#
#   gap_threshold_multiplier:
#     1 トピックを「ギャップ過大」とみなす倍率。最大ギャップが
#     (中央値インターバル × この倍率) を超えると per-topic の gap_exceeded=true。
#     未指定なら全トピックの cadence をそのまま報告する従来挙動（既定 5.0）。
#   target_topics:
#     報告対象に絞り込むトピック名の glob リスト（例 "/hsrb/*"）。
#     空 / 未指定なら収録内の全トピックを対象にする（従来挙動）。
# =============================================================================
gap_threshold_multiplier: 5.0
target_topics: []
