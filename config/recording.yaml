# =============================================================================
# kairos recording / monitoring config (RECORDING_CONFIG)  — template
# =============================================================================
# Shared deployment-tuning config (see docs/specs/ja/config.md, three-layer #2).
# Consumed by:
#   - rosbag2_recorder : default_topics selection + per-topic QoS for recording
#   - topic_monitor    : expected_hz + QoS for lightweight subscribe
#   - dora_runner      : validation.required_topics (fast_validation, stage 3)
#
# Declares default_topics / expected_hz_patterns / monitor QoS. The LeRobot
# topic->feature mapping (the dataset section) follows bagel's configs/*.yaml.
# Topics support glob patterns (fnmatch); pattern lists are first-match-wins.
# Copy this file per robot (e.g. config/airoa_hsr.yaml) and point
# RECORDING_CONFIG at it.
# =============================================================================

robot_name: template

# ---- Topics recorded by default / pre-selected in the UI (glob allowed) -----
default_topics:
  - /joint_states
  - "/camera/*/image_raw/compressed"

# ---- Expected Hz for monitor quality (first match wins). --------------------
# Omit `hz` (leave null) to dynamically learn the rate after subscribe.
expected_hz_patterns:
  - pattern: "**/compressed"
    hz: 30
  - pattern: "/joint_states"
    hz: 50

# ---- Per-topic QoS overrides (OPTIONAL; first match wins). ------------------
# By default rosbag2 record ADAPTS to each publisher's offered QoS — the right
# behavior, so leave this empty. Only override when you must force a profile;
# forcing `reliable` on a best_effort publisher records ZERO messages.
# Example (uncomment to force the cameras to best_effort):
#   - pattern: "**/compressed"
#     reliability: best_effort
#     durability: volatile
#     depth: 1
topic_qos_overrides: []

# ---- topic_monitor tuning ---------------------------------------------------
monitor:
  qos_depth: 30
  stamp_quality: true        # use header.stamp for late/loss when safely available
  window_s: [1, 5]           # sliding-window sizes (seconds)

# ---- rosbag2_recorder tuning ------------------------------------------------
recording:
  discovery_timeout_s: 10
  start_delay_s: 2.0         # wait for drivers/cameras to ramp up
  # Start-lag mitigation (opt-in): spawn `ros2 bag record --start-paused`, wait
  # until the recorder has subscribed to the target topics, then resume — so the
  # bag begins with all subscriptions live (no first frames dropped during DDS
  # discovery). Fail-safe: if resume can't be confirmed the start fails visibly.
  # Off by default (the gate runs in the ROS image only); enable once verified.
  start_paused: false
  subscription_ready_timeout_s: 5.0   # max wait for subscriptions before resuming
  storage: mcap              # canonical recording format
  compression: none          # none | zstd

# ---- Validation (dora_runner fast_validation, stage 3) ----------------------
# Required topics a recorded run must contain. The validation-template
# generator can produce this list from an existing good run.
validation:
  required_topics:
    - name: /joint_states
    - name: "/camera/*/image_raw/compressed"

# ---- dataset_convert (dora_runner, stage 3) ---------------------------------
# LeRobot feature mapping (observations[]/actions[]) lives here when stage 3
# lands. Structure mirrors bagel configs/*.yaml: each entry has
#   key / topic / msg_type / selector / dtype / image_size / stamp_source ...
# Left unset until stage 3.
# dataset:
#   fps: 30
#   observations: []
#   actions: []
