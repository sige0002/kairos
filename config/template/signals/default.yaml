# =============================================================================
# kairos Signals default display (template)
# =============================================================================
# Optional. Copy this file per robot to config/<robot>/signals/default.yaml and
# it becomes the default field selection for the Review > Signals section on that
# robot. Behaviour when loading:
#   - file absent    -> the built-in fallback is used (hide `header.*`, and
#                       auto-select the first 4 non-hidden numeric leaves).
#   - file present   -> served by GET /api/v1/config/signals and editable in
#                       Settings > Data quality (form + Advanced raw YAML).
#
# Display-only: applies immediately (no service restart). A field named in a rule
# that is absent from a given signal_report is ignored at render time, so it is
# safe to list fields that only some recordings carry.
#
# Schema (known keys only; unknown keys are rejected on save):
#
#   hidden_field_patterns:  list of fnmatch patterns on field paths. A leaf that
#                           matches any pattern is hidden behind "Show all
#                           fields" and is never auto-selected by the fallback.
#                           Default: [] (nothing hidden). `*` matches across
#                           dots, e.g. `header.*` hides `header.stamp.sec`.
#   default_topic:          the topic to open first. When it is absent from the
#                           report, falls back to the first topic whose msg_type
#                           matches a `defaults` rule below, then the first topic.
#   defaults:               per-msg_type field selections. The first rule whose
#                           `msg_type` matches the chosen topic's message type
#                           wins; its `fields` (dotted/indexed field paths, the
#                           same vocabulary as the live Probe view) are selected,
#                           minus any that the report does not carry.
#                             - msg_type: <ROS msg type, e.g. sensor_msgs/msg/JointState>
#                               fields:   [<field path>, ...]
#   fallback_fields:        when no rule matched (or all its fields were absent),
#                           select the first N non-hidden numeric leaves. Must be
#                           >= 0. Default: 4.
# -----------------------------------------------------------------------------

hidden_field_patterns: ["header.*"]
default_topic:
defaults: []
  # Example: default to the first six joint positions for a JointState topic.
  # - msg_type: sensor_msgs/msg/JointState
  #   fields: ["position[0]", "position[1]", "position[2]"]
  #
  # Example: default to the planar base twist for a Twist topic.
  # - msg_type: geometry_msgs/msg/Twist
  #   fields: ["linear.x", "angular.z"]
fallback_fields: 4
