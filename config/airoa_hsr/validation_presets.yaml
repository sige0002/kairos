# =============================================================================
# config/airoa_hsr/validation_presets.yaml — one-click validations (Validation tab)
# =============================================================================
# Validation タブ上部の「ワンクリック検証ボタン」を定義する。各 preset は
# dora_runner の pipeline を固定 params で束ねたもの。ボタンを押すと、その
# pipeline でまだ検証していない完了収録（objects/ にある capture）すべてに
# 対して一括実行する（実行対象＝未検証データ）。
#
# フィールド:
#   id          必須。^[a-z0-9_]+$。preset の安定キー。
#   name        必須。ボタン表示名。
#   description 任意。ボタンの補足。
#   pipeline    必須。dora_runner の pipeline id（GET /api/v1/pipelines）。
#   params      任意。POST /jobs にそのまま渡す（fast_validation なら template id）。
#
# 「未検証」判定は pipeline 単位（report/<pipeline>/<capture_id>/summary.json の有無）。
# したがって同じ pipeline を使う preset は「検証済み」状態を共有する（1 pipeline
# = 1 preset を推奨）。plugin を追加すれば、その id をここに書くだけで押せる。
# =============================================================================
presets:
  - id: hsr_required_topics
    name: HSR required topics
    description: Required-topic presence check (fast_validation, airoa_hsr template).
    pipeline: fast_validation
    params:
      template: airoa_hsr

  - id: hsr_quick_gate
    name: HSR quick gate
    description: >-
      Decode/blur/brightness/freeze + gap and rate checks on real dora
      (config/airoa_hsr/flows/default.yml).
    pipeline: full_validation
    params:
      flow: default

  - id: loss_scan
    name: Loss scan
    description: Per-topic gap-based loss estimate across every topic.
    pipeline: loss_report

  - id: greeting_demo
    name: Greeting demo
    description: hello_kairos template plugin — writes "hello kairos!".
    pipeline: hello_kairos
    params:
      subject: kairos
