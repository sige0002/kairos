# =============================================================================
# config/airoa_hsr/flows/default.yml — full_validation の検証フロー（HSR サンプル）
# =============================================================================
# 録画後クイックゲート。dora 上で「カメラを1回だけデコードして、そのフレームを
# ブレ／露出／フリーズの各チェックに配り、状態トピックの欠落を見て、全トピックの
# 記録有無とレートを metadata から確認する」構成。
#
# このファイルは **bagflow の flow.yml そのもの**（services/dora_runner/bagflow/
# README.md）。kairos 側は実行のたびに以下だけを足す（docs/specs/ja/dora_runner.md）:
#   * bag  = data/recorded/<run_id>（または dataset_dir）
#   * report = data/report/full_validation/<run_id>/report.json
#   * ${KAIROS_*} の展開
#   * path のバイナリ名解決（bagflow-* は同梱バイナリ）
# したがって bag: / report: はここに書かない（書いても上書きされる）。
#
# ${KAIROS_EXPECT_HZ} は「必須トピック（Config タブの検証テンプレ、無ければ
# RECORDING_CONFIG の validation.required_topics）」＋「RECORDING_CONFIG の
# expected_hz_patterns」を1つの {topic: hz} に畳んだもの。hz=0 は「存在必須・
# レートは問わない」を意味する（bagflow-topic-rate は bag に無いトピックを失敗と
# して報告し、0 を下回るレートは存在しない）。閾値はここではなく config 側で直す。
#
# 実測（101秒・780MB・29トピックの bag / VGA 3037フレーム、warm）: 0.56s / 3.7 CPU秒。
# =============================================================================
defaults:
  queue_size: 256

nodes:
  # JPEG → 生フレーム。デコードは全体で1回だけ行い、下流は共有メモリ上の
  # 同じフレームをゼロコピーで参照する。
  - id: decode
    path: bagflow-decode
    inputs:
      images: /hsrb/hand_camera/image_raw/compressed
    outputs: [frames]
    env:
      RESIZE: 224x224
      # 下の3チェックは輝度しか見ないので輝度プレーンだけデコードする
      # （色変換が消え、共有メモリを流れる量が 1/3 になる）。mp4 など色が
      # 要る消費者を足すときは削ること。
      PIXEL_FORMAT: gray

  # ブレ・ピンボケ（Laplacian 分散）
  - id: blur
    path: bagflow-blur
    inputs:
      frames: decode/frames
    env:
      RESIZE: 224x224

  # 露出異常（暗すぎ／白飛び）
  # 注: PIXEL_FORMAT: gray では mean が輝度加重になり数ポイント高く出る。
  # DARK_MEAN / BRIGHT_MEAN を触るときはその前提で。
  - id: brightness
    path: bagflow-brightness
    inputs:
      frames: decode/frames

  # カメラ固まり（連続同一フレーム）。1フレームあたりの処理が最も重く、
  # デコーダのバーストをキューが吸う構造なので深めに取る（約50MBのshm）。
  - id: freeze
    path: bagflow-freeze
    queue_size: 1024
    inputs:
      frames: decode/frames

  # 状態トピックの欠落・停止（stamp の間隔）
  - id: stamp_gap
    path: bagflow-stamp-gap
    inputs:
      msgs: /hsrb/joint_states
    env:
      # 既定の「中央値 x GAP_FACTOR」ではなく絶対値で見る。同梱サンプル
      # （data/airoa-moma-mcap/000730）の /hsrb/joint_states は到着が二峰性で
      # 中央値 13.1ms・最大 48.4ms、既定 3 倍（39.4ms）だと健全な録画でも
      # 878/2199 本が「ギャップ」になり誤警報になる（実測）。実際の停止を
      # 拾う閾値として 200ms を採る。
      GAP_MS: '200'

  # 全トピックの記録有無とレート（metadata 由来・デコード無し）
  - id: topic_rate
    path: bagflow-topic-rate
    env:
      EXPECT_HZ: '${KAIROS_EXPECT_HZ}'
      TOLERANCE: '0.9'
