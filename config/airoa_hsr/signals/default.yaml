# =============================================================================
# kairos Signals default display — Toyota HSR (AIRoA MOMA dataset)
# =============================================================================
# Which decoded numeric fields the Review > Signals section shows by default,
# per robot. Display-only: applies immediately (no service restart). Fields that
# don't exist in a given signal_report are simply ignored at render time.
# Full schema + field docs: config/template/signals/default.yaml.
# Served + edited via GET/PUT /api/v1/config/signals (Settings > Data quality).
# =============================================================================

# fnmatch patterns on field paths; matching leaves are hidden behind "Show all
# fields" and are never auto-selected by the fallback.
hidden_field_patterns: ["header.*"]

# Preferred topic to open first. Falls back to the first topic whose msg_type
# matches a rule below when this topic is absent from the report.
default_topic: /hsrb/joint_states

# Per-msg_type default field selections (first rule whose msg_type matches the
# chosen topic wins). Absent fields are dropped silently.
defaults:
  - msg_type: sensor_msgs/msg/JointState
    fields: ["position[0]", "position[1]", "position[2]", "position[3]", "position[4]", "position[5]"]
  - msg_type: geometry_msgs/msg/Twist
    fields: ["linear.x", "angular.z"]
  - msg_type: geometry_msgs/msg/WrenchStamped
    fields: ["wrench.force.x", "wrench.force.y", "wrench.force.z"]
  - msg_type: trajectory_msgs/msg/JointTrajectory
    fields: ["points[0].positions[0]", "points[0].positions[1]", "points[0].positions[2]"]

# No rule matched -> select the first N non-hidden numeric leaves.
fallback_fields: 4
