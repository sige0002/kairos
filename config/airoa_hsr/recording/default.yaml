robot_name: hsr
default_topics:
- /hsrb/joint_states
- /hsrb/wrist_wrench/raw
- /hsrb/odom
- /hsrb/command_velocity
- /hsrb/arm_trajectory_controller/command
- /hsrb/head_rgbd_sensor/rgb/image_rect_color/compressed
- /hsrb/hand_camera/image_raw/compressed
expected_hz_patterns:
- pattern: '**/compressed'
  hz: 10.0
- pattern: /hsrb/wrist_wrench/raw
  hz: 100.0
- pattern: /hsrb/joint_states
  hz: 25.0
- pattern: /hsrb/base_scan
  hz: 40.0
- pattern: /hsrb/command_velocity
  hz: 30.0
- pattern: /hsrb/arm_trajectory_controller/command
  hz: 30.0
- pattern: /hsrb/odom
  hz: 25.0
topic_qos_overrides: []
monitor:
  qos_depth: 30
  stamp_quality: true
  window_s:
  - 1
  - 5
  warn_shortfall: 0.02
  danger_shortfall: 0.05
  min_status_count: 20.0
  status_escalate_s: 2.0
  status_recover_s: 1.0
  baseline_learning: true
  baseline_warmup_s: 8.0
  baseline_stable_cv: 0.2
  baseline_min_samples: 8
  self_load_metrics: true
  callback_lag_warn_ms: 50.0
  snapshot_age_warn_s: 2.0
recording:
  discovery_timeout_s: 10.0
  start_delay_s: 0.0
  start_paused: true
  subscription_ready_timeout_s: 5.0
  post_discovery_delay_s: 0.5
  prepare_disarm_timeout_s: 120.0
  pre_arm: true
  max_cache_size_mb: 512
  storage: mcap
  compression: none
validation:
  required_topics:
  - name: /hsrb/joint_states
    type: sensor_msgs/msg/JointState
  - name: /hsrb/head_rgbd_sensor/rgb/image_rect_color/compressed
    type: sensor_msgs/msg/CompressedImage
  - name: /hsrb/hand_camera/image_raw/compressed
    type: sensor_msgs/msg/CompressedImage
  - name: /hsrb/command_velocity
    type: geometry_msgs/msg/Twist
  - name: /hsrb/arm_trajectory_controller/command
    type: trajectory_msgs/msg/JointTrajectory
transfer:
  auto_pull_on_save: false
