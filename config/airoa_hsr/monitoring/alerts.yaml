# =============================================================================
# kairos topic_monitor alert rules — Toyota HSR (AIRoA MOMA dataset)
# =============================================================================
# Concrete alert rules for the airoa-moma-mcap sample bags (HSR, /hsrb/*).
# Full schema + field docs: config/template/monitoring/alerts.yaml.
# Wire in with ALERT_CONFIG_PATH=/config/airoa_hsr/monitoring/alerts.yaml.
#
# Thresholds are deliberately conservative: each is set well below the topic's
# expected Hz (see config/airoa_hsr/recording/default.yaml -> expected_hz_
# patterns) so a healthy replay never flaps, but a real rate collapse (roughly
# half-rate or worse) fires. clear_after_s / cooldown_s debounce brief dips.
# Both topics are concrete entries of that config's default_topics.
#
# Topics without an explicit rule below are still covered on their hz, by one of
# two automatic mechanisms (each topic's hz has exactly ONE owner — no double
# incident — with precedence config rule > derived rule > default synthesizer):
#   - Derived rules: any topic WITH an expected_hz (see recording/default.yaml ->
#     expected_hz_patterns) auto-gets a hz incident from its measured shortfall —
#     WARNING below 0.8x expected, DANGER below 0.5x expected (sustained). Tune or
#     disable these globally with a top-level `derived_rules:` block
#     (warn_ratio / danger_ratio / enabled / sustain_s / clear_after_s /
#     cooldown_s); see config/template/monitoring/alerts.yaml for the schema.
#   - Default synthesizer: a topic with NO expected_hz that the monitor still
#     classifies `danger` (from a learned baseline), sustained ~10 s, raises a
#     default hz incident — so Events never stays empty while the table shows
#     DANGER. The rules below OVERRIDE the derived defaults for these feeds
#     (per topic + hz metric), tuning the exact threshold/hysteresis that matters.
#
# Note: do NOT write `metric: loss` rules. `loss_rate` is hardcoded null in the
# monitor (true message loss is not computable in ROS 2 without sequence numbers,
# and DDS sample-lost is the monitor's own drop, not the publisher's/rosbag's), so
# a `loss` rule is never evaluated and can NEVER fire. Use hz / gap instead.
# -----------------------------------------------------------------------------

rules:
  # Robot joint-state feed. Expected ~25 Hz; warn if it drops below 15 Hz for 3 s.
  - topic: /hsrb/joint_states
    metric: hz
    op: lt
    threshold: 15
    clear_after_s: 3
    cooldown_s: 10

  # Head RGB-D color camera (compressed). Expected ~30 Hz; warn below 15 Hz.
  - topic: /hsrb/head_rgbd_sensor/rgb/image_rect_color/compressed
    metric: hz
    op: lt
    threshold: 15
    clear_after_s: 3
    cooldown_s: 10

  # Hand camera (compressed). Expected ~30 Hz; warn below 15 Hz. Added after
  # persona review R2: this topic sat in a sustained table-DANGER (8-9 Hz)
  # with zero events because it had no rule — every default_topics camera
  # should carry one.
  - topic: /hsrb/hand_camera/image_raw/compressed
    metric: hz
    op: lt
    threshold: 15
    clear_after_s: 3
    cooldown_s: 10
