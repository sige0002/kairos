# Live (dora_live) lane config for the bundled HSR sample.
# All defaults: the live set inherits recording/default.yaml default_topics,
# QoS auto-matches the discovered publishers, and the two compressed camera
# topics join the WebRTC preview lane by type. See config/template/live/ for
# the full annotated schema.
topics: null
extra_topics: []
exclude: []
qos_overrides: []
video: []
video_defaults:
  max_fps: 15
  max_width: null
  max_height: null
frames:
  enabled: true
  sample_hz: 2.0
queues:
  metrics: null
  probe: 4
  webrtc: 2
  frames: 2
queue_size: 1000
