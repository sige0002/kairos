# =============================================================================
# config/<robot>/stream/default.yaml — Stream タブの初期レイアウト（WebRTC カメラプレビュー）
# =============================================================================
# 「最初に何枚のプレビューを、どのカメラ topic で開くか」を決める設定。
# UI 側で消費する想定（frontend の Stream タブが GET /api/v1/config 経由でこれを
# 読み、起動時のペインを初期化する）。コードを触らず既定プレビューを変えられる。
# 流れていない topic は、ロボット/bag が publish するまで "offline" 表示になる。
#
# この既定値は同梱の HSR サンプル（data/airoa-moma-mcap）に合わせてある。
# ロボットごとにコピー/編集して使う。Docker では STREAM_CONFIG=/config/<robot>/stream/default.yaml
# で指す想定。
#
# 注意: 深度の .../compressedDepth は cv2 で復号できず黒画面になるため、既定の
# プレビュー対象にはしない（RGB の compressed/image_raw を使う）。
# =============================================================================

# プレビューグリッドの列数（UI ヒント、1〜4）。ペインは次の行に折り返す。
columns: 2

# 初期ペイン（順番どおり）。各ペインは 1 つのカメラ(image) topic を映す。
# - panes を空リストにすると、空ペインが 1 枚開いて UI で選ぶ運用になる。
# - 実行時の「+ Add camera」/「Remove」はこの設定に関係なく常に使える。
panes:
  - topic: /hsrb/head_rgbd_sensor/rgb/image_rect_color/compressed   # head RGB
  - topic: /hsrb/hand_camera/image_raw/compressed                   # hand camera
