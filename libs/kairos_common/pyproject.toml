[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairos-common"
version = "0.1.0"
description = "Shared settings, config loader, and FastAPI helpers for kairos services."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "fastapi>=0.111",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
    # field_introspect's regression tests reproduce rosidl's decoded shapes
    # (numpy ndarrays for fixed-length arrays, numpy scalars for numeric leaves)
    # without a live ROS graph, so the pure-logic walk is verified against them.
    "numpy>=1.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kairos_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
