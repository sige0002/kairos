# Test harness: replay a recorded rosbag (MCAP) onto the ROS 2 graph
# (ROS_DOMAIN_ID from env, default 0) so services can be exercised against real recorded data —
# and *see* what is flowing while it plays.
#
# Two services:
#   rosbag_player  — plays a bag once (single-shot). Prints `ros2 bag info`
#                    first so you can see what it contains, then plays.
#   topic_table    — live, refreshing table of every topic on the graph with
#                    per-topic Hz / bandwidth / count (the observable view).
#
# Usage (from repo root) — run the table in one terminal, the player in another:
#   docker compose -f deploy/test/compose.yaml run --rm topic_table
#   docker compose -f deploy/test/compose.yaml run --rm rosbag_player
#
# Pick a different bag / loop it. BAG is a path UNDER data/ (the rule: bags live
# in data/); an absolute /data/... path also works. Set BAG in the root .env to
# make it persistent (the Makefile passes --env-file .env to this harness).
#   BAG=airoa-moma-mcap/000730 docker compose -f deploy/test/compose.yaml run --rm rosbag_player
#   LOOP=--loop docker compose -f deploy/test/compose.yaml run --rm rosbag_player
#
# ROS_DISTRO is overridable: ROS_DISTRO=humble docker compose -f deploy/test/compose.yaml build
name: kairos-test

x-ros-common: &ros-common
  build:
    context: .
    args:
      ROS_DISTRO: ${ROS_DISTRO:-jazzy}
  image: kairos-rosbag-player:${ROS_DISTRO:-jazzy}
  # Share the host's ROS 2 DDS graph so replayed topics reach services on the
  # host / other containers.
  network_mode: host
  # Share host IPC so FastDDS shared-memory transport delivers data to other
  # containers (host networking carries only UDP discovery, not the SHM data plane).
  ipc: host

services:
  rosbag_player:
    <<: *ros-common
    environment:
      # Shared ROS 2 domain for all kairos containers/tests.
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      # Match the kairos services' DDS implementation (default Fast DDS; set to
      # rmw_cyclonedds_cpp to replay onto a Cyclone DDS graph).
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # Same participant-index headroom as the stack (see config/cyclonedds.xml):
      # under LIVE=1 the per-topic bridges consume indexes first, and the player
      # would otherwise die with "Failed to find a free participant index".
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///config/cyclonedds.xml}
    volumes:
      # Share recorded bags read-only (repo data/ -> /data).
      - ../../data:/data:ro
      # DDS tuning files (cyclonedds.xml etc.).
      - ../../config:/config:ro
      # Custom-message overlays (whole tree, read-only). `ros2 bag play` needs the
      # typesupport to PUBLISH custom-type topics, so the player sources the same
      # robot overlay the recorder/monitor use (selected by MSGS_OVERLAY_DIR).
      - ../../deploy/msgs_overlay:/overlays:ro
    # Source the selected robot's overlay (basename of MSGS_OVERLAY_DIR, default
    # 'robot'), then print what the bag contains and play it ONCE (--clock
    # publishes /clock). BAG is a path under data/ (resolved to /data/<BAG>); an
    # absolute /data/... path is used as-is. Set LOOP=--loop to repeat. Without a
    # built overlay, custom-type topics are skipped (standard types still play).
    command:
      - bash
      - -lc
      - 'R="$$(basename "${MSGS_OVERLAY_DIR:-robot}")";
         OVL="/overlays/$$R/install/setup.bash";
         if [ -f "$$OVL" ]; then . "$$OVL"; echo "rosbag_player: sourced overlay $$R"; else echo "rosbag_player: no overlay for $$R (custom-type topics skipped)"; fi;
         BAG="${BAG:-airoa-moma-mcap/115647}";
         case "$$BAG" in /*) P="$$BAG";; *) P="/data/$$BAG";; esac;
         ros2 bag info "$$P"
         && echo "--- playing $$P (overlay=$$R, LOOP=${LOOP:-off}) ---"
         && ros2 bag play "$$P" --clock ${LOOP:-}'

  topic_table:
    <<: *ros-common
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      # Match the kairos services' DDS implementation (see rosbag_player above).
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///config/cyclonedds.xml}
      # REFRESH=<s> table interval; DURATION=<s> auto-exits (handy for smoke tests).
      REFRESH: ${REFRESH:-1.0}
      DURATION: ${DURATION:-}
    volumes:
      - ../../data:/data:ro
      - ../../config:/config:ro
      # The live-table script (mounted, so editing it needs no rebuild).
      - ./topic_table.py:/topic_table.py:ro
    command: ["python3", "/topic_table.py"]
