# =============================================================================
# kairos recording / monitoring config — Toyota HSR (AIRoA MOMA dataset)
# =============================================================================
# Concrete config for the airoa-moma-mcap sample bags under data/.
# Topics/types/rates derived from `ros2 bag info data/airoa-moma-mcap/235210`
# (HSR mobile manipulator; /hsrb namespace). Used for Stage 1–2 testing.
# Set RECORDING_CONFIG=deploy/config/airoa_hsr.yaml to use this file.
# =============================================================================

robot_name: hsr

# ---- Default topics to record / pre-select (the meaningful HSR streams) -----
default_topics:
  - /hsrb/joint_states
  - /hsrb/wrist_wrench/raw
  - /hsrb/odom
  - /hsrb/command_velocity
  - /hsrb/arm_trajectory_controller/command
  - /hsrb/head_rgbd_sensor/rgb/image_rect_color/compressed
  - /hsrb/hand_camera/image_raw/compressed
  - /tf
  - /tf_static

# ---- Expected Hz for monitor quality (first match wins; from bag counts) -----
expected_hz_patterns:
  - pattern: "**/compressed"
    hz: 30
  - pattern: "/hsrb/wrist_wrench/raw"
    hz: 100
  - pattern: "/hsrb/joint_states"
    hz: 50
  - pattern: "/hsrb/base_scan"
    hz: 40
  - pattern: "/hsrb/command_velocity"
    hz: 30
  - pattern: "/hsrb/arm_trajectory_controller/command"
    hz: 30
  - pattern: "/hsrb/odom"
    hz: 26

# ---- Per-topic QoS overrides (OPTIONAL; first match wins) -------------------
# By default rosbag2 record ADAPTS to each publisher's offered QoS — the right
# behavior. Only override when you must force a profile; forcing `reliable` on a
# best_effort publisher (e.g. the airoa cameras) records ZERO messages. The
# airoa bags publish with default QoS, so leave this empty (use adaptation).
topic_qos_overrides: []

monitor:
  qos_depth: 30
  stamp_quality: true
  window_s: [1, 5]

recording:
  discovery_timeout_s: 10
  start_delay_s: 1.0
  storage: mcap
  compression: none

# ---- fast_validation required topics (dora_runner, stage 3) ------------------
validation:
  required_topics:
    - name: /hsrb/joint_states
      type: sensor_msgs/msg/JointState
    - name: /hsrb/head_rgbd_sensor/rgb/image_rect_color/compressed
      type: sensor_msgs/msg/CompressedImage
    - name: /hsrb/hand_camera/image_raw/compressed
      type: sensor_msgs/msg/CompressedImage
    - name: /hsrb/command_velocity
      type: geometry_msgs/msg/Twist
    - name: /hsrb/arm_trajectory_controller/command
      type: trajectory_msgs/msg/JointTrajectory

# Note: /hsrb/servo_states uses a custom type (tmc_control_msgs/msg/ServoState).
# Recorder stores it as-is (raw bytes); topic_monitor does not decode it; only
# dataset_convert (stage 3) would need the message definition.
