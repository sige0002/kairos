# kairos ROS integration CI — runs the recorder's REAL `ros2 bag record`
# round-trip (services/rosbag2_recorder/tests/test_integration_ros.py). That test
# is skipif-guarded on `ros2` being on PATH, so it is skipped in the plain-runner
# suite (ci.yml) and exercised here inside the ROS 2 container instead.
#
# Separate workflow (not a job in ci.yml) because it needs the full ROS 2
# toolchain image and the rosbag2 MCAP storage plugin; keeping it apart means a
# ROS-base pull never slows the fast unit-test gate.
name: ROS integration

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ros-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recorder-roundtrip:
    name: recorder ros2 bag record round-trip
    runs-on: ubuntu-latest
    # Same base as the recorder image (services/rosbag2_recorder/Dockerfile) so
    # the test exercises the real ROS 2 + rosbag2 stack it ships on.
    container:
      image: ros:jazzy-ros-base
    env:
      ROS_DISTRO: jazzy
      # Isolate this run's DDS graph from anything else on the runner network.
      ROS_DOMAIN_ID: "99"
      UV_PYTHON_PREFERENCE: only-system
      UV_PROJECT_ENVIRONMENT: /opt/venv
      # The --system-site-packages venv exposes ROS's launch_testing pytest
      # plugin, whose legacy hookspec is incompatible with the locked pytest 8.x.
      # This test needs no third-party pytest plugins, so disable autoload.
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      # git is needed by actions/checkout; the mcap storage plugin gives
      # `ros2 bag record --storage mcap` (matches the recorder runtime image).
      - name: Install git + rosbag2 mcap storage plugin
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends \
            git \
            ros-jazzy-rosbag2-storage-mcap
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.0"
      - name: Build recorder env from lock + run integration test
        working-directory: services/rosbag2_recorder
        # MUST be bash: ROS's setup.bash is not POSIX sh (it uses `builtin` and
        # ${var//} substitution), and inside this container Actions otherwise
        # runs the step under dash — which fails with the misleading
        # "/opt/ros/jazzy/setup.bash: builtin: not found" (exit 127). Verified by
        # running the same source line under sh vs bash in ros:jazzy-ros-base.
        shell: bash
        run: |
          set -e
          . /opt/ros/jazzy/setup.bash
          # --system-site-packages so the ROS-provided rclpy/ros2 stay importable
          # (parity with the recorder Dockerfile); deps come from the committed lock.
          uv venv --python python3 --system-site-packages /opt/venv
          uv sync --frozen --extra test
          . /opt/venv/bin/activate
          pytest tests/test_integration_ros.py -v
