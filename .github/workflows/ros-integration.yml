# kairos ROS integration CI — runs the recorder's REAL `ros2 bag record`
# round-trip (services/rosbag2_recorder/tests/test_integration_ros.py). That test
# is skipif-guarded on `ros2` being on PATH, so it is skipped in the plain-runner
# suite (ci.yml) and exercised here inside the ROS 2 container instead.
#
# Separate workflow (not a job in ci.yml) because it needs the full ROS 2
# toolchain image and the rosbag2 MCAP storage plugin; keeping it apart means a
# ROS-base pull never slows the fast unit-test gate.
name: ROS integration

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ros-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recorder-roundtrip:
    name: recorder ros2 bag record round-trip
    runs-on: ubuntu-latest
    # Same base as the recorder image (services/rosbag2_recorder/Dockerfile) so
    # the test exercises the real ROS 2 + rosbag2 stack it ships on.
    container:
      image: ros:jazzy-ros-base@sha256:6513503d0b10e919fbe8134981d4f9d19b5c1f9b045b87a9fe3b0b9e03e7c2a9
    env:
      ROS_DISTRO: jazzy
      # Isolate this run's DDS graph from anything else on the runner network.
      ROS_DOMAIN_ID: "99"
      UV_PYTHON_PREFERENCE: only-system
      UV_PROJECT_ENVIRONMENT: /opt/venv
      # The --system-site-packages venv exposes ROS's launch_testing pytest
      # plugin, whose legacy hookspec is incompatible with the locked pytest 8.x.
      # This test needs no third-party pytest plugins, so disable autoload.
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      # git is needed by actions/checkout; the mcap storage plugin gives
      # `ros2 bag record --storage mcap` (matches the recorder runtime image).
      - name: Install git + rosbag2 mcap storage plugin
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends \
            git \
            ros-jazzy-rosbag2-storage-mcap
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.0"
      - name: Build recorder env from lock + run integration test
        working-directory: services/rosbag2_recorder
        # MUST be bash: ROS's setup.bash is not POSIX sh (it uses `builtin` and
        # ${var//} substitution), and inside this container Actions otherwise
        # runs the step under dash — which fails with the misleading
        # "/opt/ros/jazzy/setup.bash: builtin: not found" (exit 127). Verified by
        # running the same source line under sh vs bash in ros:jazzy-ros-base.
        shell: bash
        run: |
          set -e
          . /opt/ros/jazzy/setup.bash
          # --system-site-packages so the ROS-provided rclpy/ros2 stay importable
          # (parity with the recorder Dockerfile); deps come from the committed lock.
          uv venv --python python3 --system-site-packages /opt/venv
          uv sync --frozen --extra test
          . /opt/venv/bin/activate
          pytest tests/test_integration_ros.py -v

  live-services:
    name: monitor/probe/streamer live ROS graph
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ROS_DOMAIN_ID: "98"
      KAIROS_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the shipped ROS service images
        run: |
          export KAIROS_VERSION="$(cat VERSION)"
          docker compose --project-directory . -f compose/compose.yaml build monitor probe streamer
      - name: Start a real compressed-image publisher
        run: |
          docker run -d --name kairos-ci-camera --network host --ipc host \
            -e ROS_DOMAIN_ID \
            ros:jazzy-ros-base@sha256:6513503d0b10e919fbe8134981d4f9d19b5c1f9b045b87a9fe3b0b9e03e7c2a9 \
            bash -lc 'source /opt/ros/jazzy/setup.bash && exec ros2 topic pub --rate 10 /hsrb/head_rgbd_sensor/rgb/image_rect_color/compressed sensor_msgs/msg/CompressedImage "{format: jpeg, data: [255, 216, 255, 217]}"'
      - name: Start services and verify live readiness
        run: |
          export KAIROS_VERSION="$(cat VERSION)"
          docker compose --project-directory . -f compose/compose.yaml up -d monitor probe streamer
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/readyz >/dev/null \
              && curl -fsS http://127.0.0.1:8003/readyz >/dev/null \
              && curl -fsS http://127.0.0.1:8002/healthz >/dev/null; then
              break
            fi
            test "$attempt" -lt 60
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/diagnostics | python3 -m json.tool
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"topic":"/hsrb/head_rgbd_sensor/rgb/image_rect_color/compressed"}' \
            http://127.0.0.1:8002/stream/start | python3 -m json.tool
      - name: Service logs
        if: failure()
        run: |
          export KAIROS_VERSION="$(cat VERSION)"
          docker compose --project-directory . -f compose/compose.yaml logs --tail=200 monitor probe streamer
      - name: Stop live graph
        if: always()
        run: |
          export KAIROS_VERSION="$(cat VERSION)"
          docker compose --project-directory . -f compose/compose.yaml down --remove-orphans || true
          docker rm -f kairos-ci-camera >/dev/null 2>&1 || true
