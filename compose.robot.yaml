# =============================================================================
# kairos — ROBOT-EDGE compose (the robot-host half of the cross-host split).
#
# WHY THIS FILE EXISTS
# kairos records image-heavy ROS 2 topics. If the recorder/monitor/streamer/probe
# run on a SEPARATE PC, each becomes a REMOTE DDS reader on the robot's graph, so
# the robot's onboard DDS must push every multi-MB camera frame over the NIC and
# service RELIABLE retransmits per remote reader — loading the robot's CPU/network
# and dropping its publish rates. To NOT load the robot, the four DDS-reading
# services run HERE, ON the robot host: they share the robot's DDS graph over
# host-networking + ipc SHM (zero extra network), and only lightweight derived
# data ever leaves the robot (monitor metrics JSON, the already-encoded WebRTC
# preview, and recorded MCAP via post-run file sync — never a heavy DDS flow).
#
# LIVE=1 keeps that same topology: dora_live replaces the monitor/streamer/probe
# trio ON this host (`make robot-up LIVE=1` = recorder + dora_live), consolidating
# their N DDS subscriptions into 1 per topic with in-process fan-out. Live topics
# never cross the wire as DDS; what leaves is the same lightweight derived data
# (metrics JSON on :8005/:8006, encoded WebRTC on :8007). Heavy analysis stays
# post-MCAP in dora_runner on the recording PC — the live lanes carry only what
# settles between takes (user ruling 2026-07-22, docs/specs/ja/dora_live.md).
#
# This is a STANDALONE file (not an overlay): it contains ONLY the robot-edge
# services, so you physically cannot start the orchestrator/dora/frontend here.
# Service definitions are pulled from compose.yaml via `extends`, so they never
# drift from the single-host default.
#
#   # on the ROBOT:
#   ROBOT=airoa_hsr ROS_DOMAIN_ID=<robot's domain> docker compose -f compose.robot.yaml up -d --build
#   # (or:  make robot-up)
#
# The recording PC runs compose.recording.yaml and points its service HOSTs at
# this robot's LAN IP. See docs/specs/ja/deployment_topology.md.
# =============================================================================
name: kairos-robot

services:
  recorder:
    extends:
      file: compose.yaml
      service: recorder
  monitor:
    extends:
      file: compose.yaml
      service: monitor
  streamer:
    extends:
      file: compose.yaml
      service: streamer
  probe:
    extends:
      file: compose.yaml
      service: probe

  # dora_live — the LIVE=1 replacement for the monitor/streamer/probe trio,
  # co-located with the robot's DDS graph (see the header). Opt-in via the
  # `live` profile; `make robot-up LIVE=1` enables it and stops the trio.
  # Its canonical-path independence is unchanged: the recorder keeps its own
  # subscriptions, so dora_live dying degrades only the live UX, never MCAP.
  dora_live:
    profiles: ["live"]
    extends:
      file: compose.yaml
      service: dora_live
